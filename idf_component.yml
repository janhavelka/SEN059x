# scripts/generate_version.py synchronizes the version from library.json.
version: "0.0.0-dev.0"
description: "Portable Modbus RTU framing and diagnostics for the DFRobot SEN0591 and SEN0592 RS485 ultrasonic sensors"
url: "https://github.com/janhavelka/SEN059x"
repository: "https://github.com/janhavelka/SEN059x.git"
license: "MIT"
maintainers:
  - "Jan Havelka (THYMOS Solution s.r.o.) <info@thymos.cz>"

# Keep release archives limited to the package and its notices.
files:
  exclude: ["**/*"]
  include:
    - "library.json"
    - "idf_component.yml"
    - "CMakeLists.txt"
    - "include/SEN059x/MeasurementCache.h"
    - "include/SEN059x/Measurements.h"
    - "include/SEN059x/ReadCodec.h"
    - "include/SEN059x/SEN059x.h"
    - "include/SEN059x/Status.h"
    - "include/SEN059x/Types.h"
    - "include/SEN059x/Version.h"
    - "include/SEN059x/WriteCodec.h"
    - "internal/WriteCodecInternal.h"
    - "src/MeasurementCache.cpp"
    - "src/Measurements.cpp"
    - "src/MeasurementTiming.cpp"
    - "src/ReadCodec.cpp"
    - "src/Status.cpp"
    - "src/Types.cpp"
    - "src/WriteCodec.cpp"
    - "LICENSE"
    - "README.md"
    - "CHANGELOG.md"
