; Illustrative ESP32-S3 development kit; change pins and board to match real hardware.
[env:esp32-s3-devkitc-1]
platform = platformio/espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D SEN059X_RX_GPIO=16
    -D SEN059X_TX_GPIO=17
    -D SEN059X_DE_GPIO=4
